<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10151c"><title>Smart House AI</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#10151c;color:#edf2f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,#183149 0,transparent 52%),#10151c}.shell{width:min(680px,100%)}header{display:flex;align-items:center;gap:12px;margin-bottom:20px}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#15354c;color:#8dd4ff;font-size:21px}h1{font-size:1.12rem;margin:0}header p{color:#8795a3;font-size:.82rem;margin:3px 0 0}.card{background:#171e27;border:1px solid #283442;border-radius:20px;padding:22px;box-shadow:0 24px 80px #0004}.auth{max-width:410px;margin:auto}.sub{color:#9eabb8;font-size:.9rem;line-height:1.5;margin:6px 0 20px}.field{display:grid;gap:7px;margin:12px 0;color:#adb8c3;font-size:.82rem}.field input{width:100%;padding:12px 13px;border:1px solid #354250;border-radius:11px;background:#10161d;color:#f0f4f8;font:inherit}.btn{border:0;border-radius:11px;padding:12px 16px;background:#55b8e8;color:#071521;font-weight:700;font:inherit;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.subtle{background:#26313e;color:#d7e0e8}.auth .btn{width:100%;margin-top:9px}.switch{border:0;background:none;color:#83cdf4;cursor:pointer;padding:12px}.notice{min-height:1.3em;color:#9caab7;font-size:.86rem;margin:10px 0 0}.notice.error{color:#ff9292}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.identity{font-size:.78rem;color:#91a0ae}.voice{display:flex;flex-direction:column;gap:13px;margin:10px 0 24px}.mic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;font:inherit;font-weight:650;font-size:.96rem;color:#e8eaed;background:#2a2f37;border:1px solid #3a404a;border-radius:12px;cursor:pointer}.mic:disabled{opacity:.55;cursor:not-allowed}.mic.listening{background:#7a2222;border-color:#a03333}.heard{font-size:.88rem;color:#8b929c;min-height:1.2em;font-style:italic}.reply{font-size:.94rem;line-height:1.5;color:#e8eaed;min-height:1.5em;white-space:pre-wrap}.type-label{display:grid;gap:8px;color:#8b929c;font-size:.82rem}.type-label input{width:100%;padding:13px;border:1px solid #354250;border-radius:12px;background:#10161d;color:#f0f4f8;font:inherit}.type-label input:focus{outline:none;border-color:#55b8e8}.hint{text-align:center;color:#687887;font-size:.74rem;margin-top:16px}@media(max-width:520px){.card{padding:17px}}
</style></head>
<body><main class="shell">
<header><div class="mark">⌂</div><div><h1>Smart House</h1><p>Talk to your home</p></div></header>
<section class="card auth" id="auth">
  <h2 id="auth-title">Sign in</h2><p class="sub" id="auth-sub">Use an approved account to talk to the house.</p>
  <form id="auth-form"><label class="field">Username<input id="username" autocomplete="username" required minlength="3" maxlength="40"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required minlength="12"></label><button class="btn" id="auth-submit">Sign in</button></form>
  <button class="switch" id="auth-switch" type="button">Request access</button><p class="notice" id="auth-notice" role="status"></p>
</section>
<section class="card hidden" id="chat-panel">
  <div class="top"><span class="identity" id="identity"></span><button class="btn subtle" id="logout" type="button">Sign out</button></div>
  <div class="voice">
    <button class="mic" id="mic" type="button"><span aria-hidden="true">🎙</span><span id="mic-label">Talk to the assistant</span></button>
    <div class="heard" id="heard"></div>
    <div class="reply" id="reply" aria-live="polite">Tell me what you would like to control.</div>
  </div>
  <div class="hint" id="tool-count" aria-live="polite">AI tool calls this session: 0</div>
  <label class="type-label">Type instead of speaking<input id="message" placeholder="e.g. turn on the red light" maxlength="500" autocomplete="off"></label>
  <div class="hint">Only approved accounts can control devices.</div>
</section></main>
<script>
const authBox=document.querySelector('#auth'),chatPanel=document.querySelector('#chat-panel'),authForm=document.querySelector('#auth-form'),authNotice=document.querySelector('#auth-notice'),message=document.querySelector('#message'),heard=document.querySelector('#heard'),reply=document.querySelector('#reply'),mic=document.querySelector('#mic'),toolCount=document.querySelector('#tool-count');let registering=false,history=[],busy=false,toolCalls=0,countKey='';
function notice(text,error=false){authNotice.textContent=text;authNotice.classList.toggle('error',error)}
function showChat(user){authBox.classList.add('hidden');chatPanel.classList.remove('hidden');document.querySelector('#identity').textContent='Signed in as '+user.username;countKey='smarthouse.toolCalls.'+user.username;toolCalls=Number(sessionStorage.getItem(countKey)||0);paintToolCount()}
function paintToolCount(){toolCount.textContent='AI tool calls this session: '+toolCalls}
async function request(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||('Request failed ('+r.status+')'));return data}
async function checkSession(){try{const user=await request('/auth/me');if(user.username)showChat(user)}catch(_){}}
document.querySelector('#auth-switch').onclick=()=>{registering=!registering;document.querySelector('#auth-title').textContent=registering?'Request access':'Sign in';document.querySelector('#auth-sub').textContent=registering?'Create an account. The owner must approve it before house controls are enabled.':'Use an approved account to talk to the house.';document.querySelector('#auth-submit').textContent=registering?'Request access':'Sign in';document.querySelector('#auth-switch').textContent=registering?'Back to sign in':'Request access';document.querySelector('#password').autocomplete=registering?'new-password':'current-password';notice('')};
authForm.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#auth-submit');btn.disabled=true;try{const data=await request(registering?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(registering)notice(data.message);else{showChat(data);notice('')}}catch(err){notice(err.message,true)}finally{btn.disabled=false}};
document.querySelector('#logout').onclick=async()=>{await request('/auth/logout',{method:'POST',body:'{}'});if(countKey)sessionStorage.removeItem(countKey);history=[];reply.textContent='Tell me what you would like to control.';heard.textContent='';toolCalls=0;paintToolCount();chatPanel.classList.add('hidden');authBox.classList.remove('hidden')};
async function sendMessage(text){text=text.trim();if(!text||busy)return;busy=true;heard.textContent=text;reply.textContent='Thinking…';reply.style.color='';message.value='';mic.disabled=true;try{const out=await request('/api/ask',{method:'POST',body:JSON.stringify({message:text,history})});reply.textContent=out.reply;toolCalls+=Number(out.tool_call_count)||0;if(countKey)sessionStorage.setItem(countKey,String(toolCalls));paintToolCount();history.push({role:'user',content:text},{role:'assistant',content:out.reply});history=history.slice(-8);if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(out.reply))}}catch(err){reply.textContent=err.message;reply.style.color='#ff9292'}finally{busy=false;mic.disabled=false}}
message.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage(message.value)}});
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(Speech){const rec=new Speech();rec.lang=navigator.language||'en-US';rec.onstart=()=>mic.classList.add('listening');rec.onend=()=>mic.classList.remove('listening');rec.onerror=()=>{reply.textContent='Could not hear you. Try again or type a request.'};rec.onresult=e=>sendMessage(e.results[0][0].transcript);mic.onclick=()=>rec.start()}else mic.classList.add('hidden');checkSession();
</script></body></html>
