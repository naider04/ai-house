<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10151c"><title>Smart House AI</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#10151c;color:#edf2f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,#183149 0,transparent 52%),#10151c}.shell{width:min(680px,100%)}header{display:flex;align-items:center;gap:12px;margin-bottom:20px}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#15354c;color:#8dd4ff;font-size:21px}h1{font-size:1.12rem;margin:0}header p{color:#8795a3;font-size:.82rem;margin:3px 0 0}.card{background:#171e27;border:1px solid #283442;border-radius:20px;padding:22px;box-shadow:0 24px 80px #0004}.auth{max-width:410px;margin:auto}.sub{color:#9eabb8;font-size:.9rem;line-height:1.5;margin:6px 0 20px}.field{display:grid;gap:7px;margin:12px 0;color:#adb8c3;font-size:.82rem}.field input{width:100%;padding:12px 13px;border:1px solid #354250;border-radius:11px;background:#10161d;color:#f0f4f8;font:inherit}.btn{border:0;border-radius:11px;padding:12px 16px;background:#55b8e8;color:#071521;font-weight:700;font:inherit;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.subtle{background:#26313e;color:#d7e0e8}.auth .btn{width:100%;margin-top:9px}.switch{border:0;background:none;color:#83cdf4;cursor:pointer;padding:12px}.notice{min-height:1.3em;color:#9caab7;font-size:.86rem;margin:10px 0 0}.notice.error{color:#ff9292}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.identity{font-size:.78rem;color:#91a0ae}.chat{height:min(56vh,480px);min-height:270px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 1px 15px}.bubble{max-width:88%;padding:11px 14px;border-radius:15px;line-height:1.45;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.assistant{align-self:flex-start;background:#222e3b;color:#e5edf5;border-bottom-left-radius:5px}.bubble.user{align-self:flex-end;background:#164563;color:#e3f6ff;border-bottom-right-radius:5px}.composer{border-top:1px solid #2b3541;padding-top:15px;display:flex;gap:9px}.composer textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:140px;padding:13px;border:1px solid #354250;border-radius:13px;background:#10161d;color:#f0f4f8;font:inherit}.mic{width:48px;padding:0;font-size:1.2rem}.hint{text-align:center;color:#687887;font-size:.74rem;margin-top:13px}@media(max-width:520px){.card{padding:17px}.chat{min-height:50vh}}
</style></head>
<body><main class="shell">
<header><div class="mark">⌂</div><div><h1>Smart House</h1><p>Talk to your home</p></div></header>
<section class="card auth" id="auth">
  <h2 id="auth-title">Sign in</h2><p class="sub" id="auth-sub">Use an approved account to talk to the house.</p>
  <form id="auth-form"><label class="field">Username<input id="username" autocomplete="username" required minlength="3" maxlength="40"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required minlength="12"></label><button class="btn" id="auth-submit">Sign in</button></form>
  <button class="switch" id="auth-switch" type="button">Request access</button><p class="notice" id="auth-notice" role="status"></p>
</section>
<section class="card hidden" id="chat-panel">
  <div class="top"><span class="identity" id="identity"></span><button class="btn subtle" id="logout" type="button">Sign out</button></div>
  <div class="chat" id="chat" aria-live="polite"><div class="bubble assistant">Hi. Tell me what you would like to control.</div></div>
  <form class="composer" id="chat-form"><textarea id="message" placeholder="Ask the house…" rows="1" maxlength="500" required></textarea><button class="btn mic" id="mic" type="button" title="Speak" aria-label="Speak">🎙</button><button class="btn" id="send">Send</button></form>
  <div class="hint">Only approved accounts can control devices. Conversations and tool logs are not shown here.</div>
</section></main>
<script>
const authBox=document.querySelector('#auth'),chatPanel=document.querySelector('#chat-panel'),authForm=document.querySelector('#auth-form'),authNotice=document.querySelector('#auth-notice'),chat=document.querySelector('#chat'),message=document.querySelector('#message');let registering=false,history=[];
function notice(text,error=false){authNotice.textContent=text;authNotice.classList.toggle('error',error)}
function showChat(user){authBox.classList.add('hidden');chatPanel.classList.remove('hidden');document.querySelector('#identity').textContent='Signed in as '+user.username;}
async function request(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||('Request failed ('+r.status+')'));return data}
async function checkSession(){try{const user=await request('/auth/me');if(user.username)showChat(user)}catch(_){}}
document.querySelector('#auth-switch').onclick=()=>{registering=!registering;document.querySelector('#auth-title').textContent=registering?'Request access':'Sign in';document.querySelector('#auth-sub').textContent=registering?'Create an account. The owner must approve it before house controls are enabled.':'Use an approved account to talk to the house.';document.querySelector('#auth-submit').textContent=registering?'Request access':'Sign in';document.querySelector('#auth-switch').textContent=registering?'Back to sign in':'Request access';document.querySelector('#password').autocomplete=registering?'new-password':'current-password';notice('')};
authForm.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#auth-submit');btn.disabled=true;try{const data=await request(registering?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(registering)notice(data.message);else{showChat(data);notice('')}}catch(err){notice(err.message,true)}finally{btn.disabled=false}};
document.querySelector('#logout').onclick=async()=>{await request('/auth/logout',{method:'POST',body:'{}'});history=[];chat.innerHTML='';chatPanel.classList.add('hidden');authBox.classList.remove('hidden')};
function addBubble(text,who){const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
document.querySelector('#chat-form').onsubmit=async e=>{e.preventDefault();const text=message.value.trim();if(!text)return;message.value='';addBubble(text,'user');const thinking=addBubble('Thinking…','assistant');document.querySelector('#send').disabled=true;try{const out=await request('/api/ask',{method:'POST',body:JSON.stringify({message:text,history})});thinking.textContent=out.reply;history.push({role:'user',content:text},{role:'assistant',content:out.reply});history=history.slice(-8);if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(out.reply))}}catch(err){thinking.textContent=err.message;thinking.style.color='#ff9292'}finally{document.querySelector('#send').disabled=false;message.focus()}};
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(Speech){const rec=new Speech();rec.lang=navigator.language||'en-US';rec.onresult=e=>{message.value=e.results[0][0].transcript;message.focus()};document.querySelector('#mic').onclick=()=>rec.start()}else document.querySelector('#mic').classList.add('hidden');checkSession();
</script></body></html>
